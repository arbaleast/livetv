name: Android CI

# 与正式 Release 流程分离：这里只做 PR / 分支推送的质量闸门，不产出发布包。
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile / Lint / UnitTest / APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # setup-gradle 默认开启 Gradle 依赖缓存与构建缓存
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # runner 自带 Android SDK，无需 setup-android 动作
      # （setup-android 内置的 `sdkmanager tools` 在当前 runner 上会失败：Failed to find package 'tools'）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: true

      - name: Install SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Kotlin compile check
        run: ./gradlew compileDebugKotlin --console=plain --no-daemon

      - name: Android Lint
        run: ./gradlew lintDebug --console=plain --no-daemon

      - name: Unit tests (JVM)
        run: ./gradlew testDebugUnitTest --console=plain --no-daemon

      # Gradle 成功时不打印用例数，这里从 XML 汇总，避免“测试静默跳过”仍显示绿。
      # 只用 POSIX sh + awk，不依赖 python3 等额外运行时。
      - name: Summarize JVM unit test results
        if: always()
        shell: sh
        run: |
          set -eu
          RESULTS_DIR="app/build/test-results/testDebugUnitTest"

          if [ ! -d "$RESULTS_DIR" ] || [ -z "$(ls "$RESULTS_DIR"/TEST-*.xml 2>/dev/null)" ]; then
            echo "::error::No JVM unit test result XML found in $RESULTS_DIR"
            exit 1
          fi

          SUMMARY=$(awk '
            function attr(name,    pat, s) {
              pat = "[[:space:]]" name "=\"[0-9]+\""
              if (match($0, pat)) {
                s = substr($0, RSTART, RLENGTH)
                gsub(/[^0-9]/, "", s)
                return s + 0
              }
              return 0
            }
            /<testsuite[[:space:]]/ {
              suites++
              tests += attr("tests")
              failures += attr("failures")
              errors += attr("errors")
              skipped += attr("skipped")
            }
            END {
              if (suites <= 0 || tests <= 0) exit 3
              passed = tests - failures - errors - skipped
              printf "%d suites, %d tests (%d passed, %d failed, %d errors, %d skipped)\n", suites, tests, passed, failures, errors, skipped
            }
          ' "$RESULTS_DIR"/TEST-*.xml) || {
            echo "::error::Failed to parse JVM unit test results: no <testsuite> entries or zero tests"
            exit 1
          }

          echo "JVM Unit Test Summary: $SUMMARY"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### JVM Unit Test Summary"
              echo
              echo '```'
              echo "$SUMMARY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
